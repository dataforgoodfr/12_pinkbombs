[tool.poetry]
name = "pinkbombs"
version = "0.1.0"
description = "A dataviz app about the salmon fishing and farming industry"
authors = ["DataForGood"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
dash = "^3.3.0"
dash-bootstrap-components = "^1.5.0"
flask = ">=3.1.3,<3.2"
werkzeug = ">=3.1.6,<3.2"
starlette = ">=1.3.1,<2.0"
pandas = "^2.2.1"
openpyxl = "^3.1.2"
SQLAlchemy = "^2.0.28"
psycopg2 = "^2.9.9"
python-dotenv = "^1.0.1"
psycopg2-binary = "^2.9.9"
loguru = "^0.7.2"
gunicorn = ">=22.0.0,<24.0.0"
fastapi = "^0.143.0"
uvicorn = "^0.29.0"
folium = "^0.16.0"
geopandas = "^1.1.2"

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.2"
pytest = "^9.0.3"
black = "26.3.1"
ruff = "^0.3.0"


[tool.poetry.group.jupyter.dependencies]
ipykernel = "^6.29.3"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

